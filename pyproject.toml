[project]
name = "iq-hybrid-engine"
version = "0.1.0"
description = "Imatrix-driven selective hybrid quantization for GGUF models"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
dependencies = [
    "gguf>=0.10.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/JotaAsh/iq-hybrid-engine"
Repository = "https://github.com/JotaAsh/iq-hybrid-engine"

[project.scripts]
iq-hybrid = "iq_hybrid.cli:main"
iq-imatrix-merger = "iq_hybrid.io.imatrix_merger:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=9.1.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
]

# ----------------------------------------------------------------------
#  Tooling Configurations
# ----------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "test"]
pythonpath = ["src"]
cache_dir = ".pytest_cache"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true